- name: Obtener la lista de paquetes instalados
  ansible.builtin.package_facts:

- name: "SEGURO: detener los servicios inseguros si están instalados"
  ansible.builtin.sysvinit:
    name: "{{ item.servicio }}"
    state: stopped
  loop:
    - { paquete: vsftpd,        servicio: vsftpd }
    - { paquete: openbsd-inetd, servicio: openbsd-inetd }
  when: item.paquete in ansible_facts.packages

- name: "SEGURO: desinstalar FTP y Telnet"
  ansible.builtin.apt:
    name: [vsftpd, openbsd-inetd, inetutils-telnetd]
    state: absent
    purge: true
