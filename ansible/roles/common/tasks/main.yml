- name: Actualizar la lista de paquetes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: "SEGURO: instalar actualizaciones de seguridad"
  ansible.builtin.apt:
    upgrade: dist

- name: Instalar utilidades básicas
  ansible.builtin.apt:
    name: [curl, ca-certificates, procps, less]
    state: present

- name: "SEGURO: bloquear la contraseña de root (solo acceso con llave)"
  ansible.builtin.user:
    name: root
    password: "*"

- name: "SEGURO: endurecer la configuración de SSH"
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-lab.conf
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
    mode: "0644"
  notify: recargar sshd

- name: Validar la configuración de SSH antes de recargarla
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: "ESCANEO: usuario de solo lectura para Greenbone"
  ansible.builtin.user:
    name: scanner
    shell: /bin/bash
    password: "*"
    create_home: true

- name: "ESCANEO: carpeta .ssh del usuario scanner"
  ansible.builtin.file:
    path: /home/scanner/.ssh
    state: directory
    owner: scanner
    group: scanner
    mode: "0700"

- name: "ESCANEO: autorizar la llave pública de Greenbone"
  ansible.builtin.copy:
    dest: /home/scanner/.ssh/authorized_keys
    content: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../greenbone/.scanner_key.pub') }}\n"
    owner: scanner
    group: scanner
    mode: "0600"
