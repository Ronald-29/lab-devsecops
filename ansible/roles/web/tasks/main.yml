- name: Instalar Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Publicar la configuración del sitio
  ansible.builtin.copy:
    src: default
    dest: /etc/nginx/sites-available/default
    mode: "0644"
  notify: reiniciar nginx

- name: "SEGURO: ocultar la versión de Nginx"
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*#?\s*server_tokens'
    line: '        server_tokens off;'
  notify: reiniciar nginx

- name: Página principal
  ansible.builtin.copy:
    dest: /var/www/html/index.html
    content: "<h1>web01 - Laboratorio DevSecOps</h1>\n"
    mode: "0644"

- name: "SEGURO: eliminar la carpeta de respaldos expuesta"
  ansible.builtin.file:
    path: /var/www/html/backup
    state: absent

- name: Asegurar que Nginx está iniciado
  ansible.builtin.sysvinit:
    name: nginx
    state: started
